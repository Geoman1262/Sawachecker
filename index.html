<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAWA Checkers</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f3f6fb;color:#172033}.head{padding:20px max(16px,calc((100% - 1100px)/2));background:#fff;border-bottom:1px solid #dce3ef}.head h1{margin:0 0 5px;font-size:23px}.head p{margin:0;color:#65738a}.tabs{display:flex;gap:10px;max-width:1100px;margin:18px auto 0;padding:0 14px}.tabs button{border:1px solid #d6dfec;border-radius:12px;padding:13px 20px;background:#fff;font-weight:700;cursor:pointer}.tabs button.active{background:#183d72;color:white;border-color:#183d72}.pane{max-width:1100px;margin:12px auto;padding:0 14px 22px}.pane iframe{width:100%;height:calc(100vh - 170px);min-height:650px;border:0;background:white;border-radius:12px}.hidden{display:none!important}.note{padding:12px 14px;background:#fff8dc;border:1px solid #f0df9a;border-radius:10px;margin:10px 0;color:#634f16}@media(max-width:600px){.tabs button{flex:1;padding:12px 8px}.head h1{font-size:20px}.pane iframe{height:calc(100vh - 180px);min-height:700px}}</style></head><body><header class="head"><h1>SAWA Schedule Checker</h1><p>Choose the checker you want to use.</p></header><nav class="tabs"><button id="weeklyTab" class="active" onclick="showTab('weekly')">Weekly Checker</button><button id="dailyTab" onclick="showTab('daily')">Daily Checker</button></nav><main><section id="weeklyPane" class="pane"><div class="note">Weekly Checker is loaded from its separate, preserved file.</div><iframe title="Weekly Checker" src="weekly/index.html"></iframe></section><section id="dailyPane" class="pane hidden"><iframe title="Daily Checker" src="daily/index.html"></iframe></section></main><script>function showTab(which){document.getElementById('weeklyPane').classList.toggle('hidden',which!=='weekly');document.getElementById('dailyPane').classList.toggle('hidden',which!=='daily');document.getElementById('weeklyTab').classList.toggle('active',which==='weekly');document.getElementById('dailyTab').classList.toggle('active',which==='daily')}</script></body></html>
